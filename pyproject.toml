[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "catalogsync-baseline"
version = "0.1.0"
description = "Version-aware supplier catalogue ingestion and publication"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
catalogsync = "catalogsync.cli:main"

[tool.setuptools.package-data]
catalogsync = ["schema.sql"]

[tool.setuptools.packages.find]
include = ["catalogsync*"]
